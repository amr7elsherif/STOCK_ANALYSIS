<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGX Technical Screener</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --green: #22c55e;
            --red: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .controls {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            grid-column: 1 / -1;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .symbol {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .price {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .metric-label {
            color: var(--text-secondary);
        }

        .metric-value {
            font-weight: bold;
        }

        .status {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>EGX Technical Screener</h1>
        <p style="color: var(--text-secondary);">Real-Time Market Indicators & Screener</p>
    </header>

    <div class="controls">
        <div class="input-group">
            <label for="rsiMin">Min RSI (14)</label>
            <input type="number" id="rsiMin" value="30">
        </div>
        <div class="input-group">
            <label for="rsiMax">Max RSI (14)</label>
            <input type="number" id="rsiMax" value="70">
        </div>
        <div class="input-group">
            <label for="minVolume">Min Traded Value (EGP or Millions)</label>
            <input type="number" id="minVolume" placeholder="e.g. 1000000 or 1" value="500000">
        </div>
        <button onclick="applyFilters()">Scan Market</button>
    </div>

    <div id="resultsGrid" class="grid"></div>
    <div id="statusMessage" class="status">Click "Scan Market" to pull data...</div>
</div>

<script>
    let fetchedStocks = [];

    async function fetchTradingViewData() {
        const status = document.getElementById("statusMessage");
        status.innerText = "Fetching market data...";

        const tvUrl = "https://scanner.tradingview.com/egypt/scan";
        
        // =================================================================
        // REPLACE WITH YOUR CLOUDFLARE WORKER URL:
        const workerProxy = "https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev"; 
        // =================================================================

        const proxyEndpoint = `${workerProxy}/?url=${encodeURIComponent(tvUrl)}`;

        const payload = {
            filter: [],
            options: { lang: "en" },
            symbols: { query: { types: [] }, tickers: [] },
            columns: [
                "name",
                "close",
                "change",
                "RSI",
                "Value.Traded",
                "volume",
                "average_volume_10d_calc",
                "average_volume_30d_calc",
                "description"
            ],
            sort: { sortBy: "Value.Traded", sortOrder: "desc" },
            range: [0, 150]
        };

        try {
            const response = await fetch(proxyEndpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

            const json = await response.json();
            
            fetchedStocks = json.data.map(item => {
                const d = item.d;
                
                // Calculate 20-Day Average Volume from 10D and 30D indicators
                const avg10 = d[6] || 0;
                const avg30 = d[7] || 0;
                let avg20 = (avg10 + avg30) / 2;
                if (!avg20) avg20 = d[5] || 0; // fallback to today's volume if 20D is null

                return {
                    symbol: item.s.replace("EGX:", ""),
                    name: d[8] || d[0],
                    close: d[1] || 0,
                    change: d[2] || 0,
                    rsi: d[3] || 0,
                    tradedValue: d[4] || 0,
                    volume: d[5] || 0,
                    avgVol20: avg20
                };
            });

            applyFilters();
        } catch (err) {
            console.error("Fetch Error:", err);
            status.innerText = "Error loading market data. Check your Cloudflare Worker URL.";
        }
    }

    function formatNum(num) {
        if (!num) return "0";
        if (num >= 1e6) return (num / 1e6).toFixed(2) + "M";
        if (num >= 1e3) return (num / 1e3).toFixed(1) + "K";
        return num.toFixed(0);
    }

    function applyFilters() {
        const grid = document.getElementById("resultsGrid");
        const status = document.getElementById("statusMessage");

        if (fetchedStocks.length === 0) {
            fetchTradingViewData();
            return;
        }

        grid.innerHTML = "";

        const rsiMin = parseFloat(document.getElementById("rsiMin").value) || 0;
        const rsiMax = parseFloat(document.getElementById("rsiMax").value) || 100;
        
        let minVolInput = parseFloat(document.getElementById("minVolume").value) || 0;
        // Handle input if user enters small value thinking in Millions (e.g. entering 5 instead of 5,000,000)
        if (minVolInput > 0 && minVolInput < 100) {
            minVolInput = minVolInput * 1000000;
        }

        const filtered = fetchedStocks.filter(stock => {
            const matchesRsi = stock.rsi >= rsiMin && stock.rsi <= rsiMax;
            const matchesVol = stock.tradedValue >= minVolInput;
            return matchesRsi && matchesVol;
        });

        if (filtered.length === 0) {
            status.style.display = "block";
            status.innerText = "No stocks match your filter criteria.";
            return;
        }

        status.style.display = "none";

        filtered.forEach(stock => {
            const card = document.createElement("div");
            card.className = "card";

            const changeColor = stock.change >= 0 ? "var(--green)" : "var(--red)";
            const changeSign = stock.change >= 0 ? "+" : "";

            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <div class="symbol">${stock.symbol}</div>
                        <div style="font-size: 0.75rem; color: var(--text-secondary);">${stock.name}</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="price">${stock.close.toFixed(2)} EGP</div>
                        <div style="font-size: 0.85rem; color: ${changeColor}; font-weight: bold;">
                            ${changeSign}${stock.change.toFixed(2)}%
                        </div>
                    </div>
                </div>

                <div class="metric-row">
                    <span class="metric-label">RSI (14):</span>
                    <span class="metric-value">${stock.rsi.toFixed(2)}</span>
                </div>

                <div class="metric-row">
                    <span class="metric-label">Traded Value:</span>
                    <span class="metric-value">${formatNum(stock.tradedValue)} EGP</span>
                </div>

                <div class="metric-row">
                    <span class="metric-label">20D Avg Volume:</span>
                    <span class="metric-value">${formatNum(stock.avgVol20)} shares</span>
                </div>
            `;

            grid.appendChild(card);
        });
    }

    window.onload = fetchTradingViewData;
</script>

</body>
</html>

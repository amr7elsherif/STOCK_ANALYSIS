<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGX Technical Screener</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --green: #22c55e;
            --light-green: #15803d;
            --red: #ef4444;
            --light-red: #b91c1c;
            --neutral: #eab308;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .controls {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            grid-column: 1 / -1;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .symbol {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .price {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Signal Recommendation Badges */
        .badge {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        .badge-strong-buy { background-color: var(--green); color: #000; }
        .badge-buy { background-color: var(--light-green); color: #fff; }
        .badge-neutral { background-color: var(--neutral); color: #000; }
        .badge-sell { background-color: var(--light-red); color: #fff; }
        .badge-strong-sell { background-color: var(--red); color: #fff; }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .metric-label {
            color: var(--text-secondary);
        }

        .metric-value {
            font-weight: bold;
        }

        .status {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-top: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>EGX Technical Screener</h1>
        <p style="color: var(--text-secondary);">Filter Egyptian Stocks by Technical Indicators</p>
    </header>

    <div class="controls">
        <div class="input-group">
            <label for="rsiMin">Min RSI (14)</label>
            <input type="number" id="rsiMin" value="30">
        </div>
        <div class="input-group">
            <label for="rsiMax">Max RSI (14)</label>
            <input type="number" id="rsiMax" value="70">
        </div>
        <div class="input-group">
            <label for="minVolume">Min Traded Value (in Millions EGP)</label>
            <input type="number" id="minVolume" placeholder="e.g. 5 for 5M EGP" value="1">
        </div>
        <button onclick="applyFilters()">Scan Market</button>
    </div>

    <div id="resultsGrid" class="grid"></div>
    <div id="statusMessage" class="status">Click "Scan Market" to pull technical data...</div>
</div>

<script>
    // Global variable to store raw fetched stocks
    let fetchedStocks = [];

    async function fetchTradingViewData() {
        const status = document.getElementById("statusMessage");
        status.innerText = "Connecting to market via Cloudflare proxy...";

        const tvUrl = "https://scanner.tradingview.com/egypt/scan";
        
        // =================================================================
        // REPLACE WITH YOUR REAL CLOUDFLARE WORKER URL:
        const workerProxy = "https://my-stock-proxy.amr7-elsherif.workers.dev"; 
        // =================================================================

        const proxyEndpoint = `${workerProxy}/?url=${encodeURIComponent(tvUrl)}`;

        const payload = {
            filter: [],
            options: { lang: "en" },
            symbols: { query: { types: [] }, tickers: [] },
            columns: [
                "name",
                "close",
                "change",
                "RSI",
                "Value.Traded",
                "average_volume_10d_calc",
                "average_volume_30d_calc",
                "Recommend.All",
                "description"
            ],
            sort: { sortBy: "Value.Traded", sortOrder: "desc" },
            range: [0, 150]
        };

        try {
            const response = await fetch(proxyEndpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

            const json = await response.json();
            
            // Map raw rows into clean JS Objects
            fetchedStocks = json.data.map(item => {
                const d = item.d;
                
                // Estimate 20D Avg Vol by averaging 10D and 30D indicators
                const avgVol10 = d[5] || 0;
                const avgVol30 = d[6] || 0;
                const avgVol20 = (avgVol10 + avgVol30) / 2;

                return {
                    symbol: item.s.replace("EGX:", ""),
                    name: d[8] || d[0],
                    close: d[1],
                    change: d[2],
                    rsi: d[3],
                    tradedValue: d[4] || 0,
                    avgVol20: avgVol20,
                    recommendation: d[7] || 0
                };
            });

            applyFilters();
        } catch (err) {
            console.error("Fetch Error:", err);
            status.innerText = "Error fetching market data. Ensure your Cloudflare Worker URL is correctly set.";
        }
    }

    function getRecommendationBadge(score) {
        // TradingView Recommend.All ranges from -1.0 to +1.0
        if (score >= 0.5) return `<span class="badge badge-strong-buy">Strong Buy</span>`;
        if (score >= 0.1) return `<span class="badge badge-buy">Buy</span>`;
        if (score > -0.1) return `<span class="badge badge-neutral">Neutral</span>`;
        if (score > -0.5) return `<span class="badge badge-sell">Sell</span>`;
        return `<span class="badge badge-strong-sell">Strong Sell</span>`;
    }

    function formatNumber(num) {
        if (num >= 1e6) return (num / 1e6).toFixed(2) + "M";
        if (num >= 1e3) return (num / 1e3).toFixed(1) + "K";
        return num ? num.toFixed(0) : "0";
    }

    function applyFilters() {
        const grid = document.getElementById("resultsGrid");
        const status = document.getElementById("statusMessage");

        if (fetchedStocks.length === 0) {
            fetchTradingViewData();
            return;
        }

        grid.innerHTML = "";

        const rsiMin = parseFloat(document.getElementById("rsiMin").value) || 0;
        const rsiMax = parseFloat(document.getElementById("rsiMax").value) || 100;
        
        // Input parsed in Millions EGP (e.g., input 1 = 1,000,000)
        const minVolInput = parseFloat(document.getElementById("minVolume").value) || 0;
        const minTradedValue = minVolInput * 1000000;

        const filtered = fetchedStocks.filter(stock => {
            const matchesRsi = stock.rsi >= rsiMin && stock.rsi <= rsiMax;
            const matchesVol = stock.tradedValue >= minTradedValue;
            return matchesRsi && matchesVol;
        });

        if (filtered.length === 0) {
            status.style.display = "block";
            status.innerText = "No stocks matched your filter criteria.";
            return;
        }

        status.style.display = "none";

        filtered.forEach(stock => {
            const card = document.createElement("div");
            card.className = "card";

            const changeColor = stock.change >= 0 ? "var(--green)" : "var(--red)";
            const changeSign = stock.change >= 0 ? "+" : "";

            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <div class="symbol">${stock.symbol}</div>
                        <div style="font-size: 0.75rem; color: var(--text-secondary);">${stock.name}</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="price">${stock.close ? stock.close.toFixed(2) : "N/A"} EGP</div>
                        <div style="font-size: 0.85rem; color: ${changeColor}; font-weight: bold;">
                            ${changeSign}${stock.change ? stock.change.toFixed(2) : "0.00"}%
                        </div>
                    </div>
                </div>

                <div class="metric-row">
                    <span class="metric-label">Signal Recommendation:</span>
                    <span>${getRecommendationBadge(stock.recommendation)}</span>
                </div>

                <div class="metric-row">
                    <span class="metric-label">RSI (14):</span>
                    <span class="metric-value">${stock.rsi ? stock.rsi.toFixed(2) : "N/A"}</span>
                </div>

                <div class="metric-row">
                    <span class="metric-label">Traded Value (Today):</span>
                    <span class="metric-value">${formatNumber(stock.tradedValue)} EGP</span>
                </div>

                <div class="metric-row">
                    <span class="metric-label">Est. 20D Avg Vol:</span>
                    <span class="metric-value">${formatNumber(stock.avgVol20)} shares</span>
                </div>
            `;

            grid.appendChild(card);
        });
    }

    // Auto-run on load
    window.onload = fetchTradingViewData;
</script>

</body>
</html>
